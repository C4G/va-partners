# Standalone MySQL for local development. Unlike docker-compose.ci.yaml (which
# defines a `db` reachable only from the app container on the compose network),
# this publishes a host port so `next dev` and the Prisma CLI can connect from
# the host. Nothing here is deployed.
#
#   docker compose -f docker-compose.local.yaml up -d
services:
  db:
    image: mysql:8.0.41
    container_name: va-partners-db
    cap_add:
      - SYS_NICE
    ports:
      - "${LOCAL_DB_PORT:-3307}:3306"
    environment:
      - MYSQL_DATABASE=${LOCAL_DB_NAME:-vision_local}
      - MYSQL_ROOT_PASSWORD=${LOCAL_DB_PASSWORD:-root}
    command:
      # 256M accommodates restoring a full production dump in one statement.
      - --max_allowed_packet=256M
      # Slow-query log to mysql.slow_log, for profiling API endpoints locally.
      - --slow_query_log=1
      - --long_query_time=0.5
      - --log_output=TABLE
    volumes:
      - local-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${LOCAL_DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  local-db-data:
