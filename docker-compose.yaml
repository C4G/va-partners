# No `build:` key on purpose — publish.yaml builds the image; IMAGE_TAG picks
# which build each Coolify app runs (test tracks latest, production pins a SHA).
services:
  # Next.js application. The entrypoint runs `prisma migrate deploy` against
  # DATABASE_URL before starting the server. In production (Coolify) DATABASE_URL
  # points at the managed database; the bundled MySQL lives in docker-compose.ci.yaml.
  app:
    image: ghcr.io/c4g/va-partners:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql://root:root@db:3306/vision}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-secret}
      - NEXT_PUBLIC_NEXTAUTH_URL=${NEXT_PUBLIC_NEXTAUTH_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # off on the test app, required on production so a failed dump blocks the migration.
      - BACKUP_MODE=${BACKUP_MODE:-best-effort}
      - BACKUP_KEEP=${BACKUP_KEEP:-10}
      - BACKUP_MYSQLDUMP_OPTS=${BACKUP_MYSQLDUMP_OPTS:-}
    volumes:
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s
    restart: unless-stopped

volumes:
  # Pre-migration dumps; must outlive the container, hence a named volume.
  backups:
