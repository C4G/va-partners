name: Publish Image

# Builds the image in CI so the shared Coolify host only pulls and restarts.
# Push to main deploys va-partners-test; production is promoted by pinning IMAGE_TAG.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be lowercase — GHCR rejects mixed-case image names, and the org is "C4G".
  # Keep in sync with the `image:` value in docker-compose.yaml.
  IMAGE: ghcr.io/c4g/va-partners

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args, so one image works in every environment. See Dockerfile.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CI only ever builds the PR head; the squashed commit on main is not
      # exercised until here. The ci overlay supplies MySQL so the entrypoint's
      # `prisma migrate deploy` runs against the published image, with no build.
      - name: Smoke test the published image
        env:
          IMAGE_TAG: ${{ github.sha }}
          NEXTAUTH_SECRET: smoke-only-not-a-real-secret
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml -p smoke up -d --pull always

          app=$(docker compose -p smoke ps -q --all app)

          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$app")
            echo "attempt $i: $status"
            case "$status" in healthy|unhealthy) break ;; esac
            sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Health.Status}}' "$app")" != "healthy" ]; then
            echo "::error::published image never became healthy"
            docker compose -p smoke logs
            exit 1
          fi

          docker compose -p smoke logs app | grep -q "Migrations applied" || {
            echo "::error::entrypoint did not report applying migrations"
            docker compose -p smoke logs app
            exit 1
          }

          # BACKUP_MODE=required in the ci overlay, so this also proves the dump was usable.
          docker compose -p smoke logs app | grep -q "Backup complete" || {
            echo "::error::entrypoint did not take a pre-migration backup"
            docker compose -p smoke logs app
            exit 1
          }

          docker exec "$app" sh -c 'gzip -t /backups/pre-migrate-*.sql.gz && ls -la /backups'

          docker exec "$app" wget -qO- http://localhost:3000/api/health
          echo "OK — pulled image migrated and served"

      - name: Stop smoke test stack
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml -p smoke down --volumes --remove-orphans || true

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ''
            echo '```'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo '```'
            echo ''
            echo "To promote this build to production, set \`IMAGE_TAG=${GITHUB_SHA}\`"
            echo "on the \`va-partners\` Coolify application and redeploy it."
          } >> "$GITHUB_STEP_SUMMARY"

      # Deploy from here, not Coolify's git webhook (off), so it cannot pull
      # `:latest` mid-push. Secrets need `env` because `if:` cannot see them.
      - name: Trigger Coolify deployment (va-partners-test)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl -fsS -X GET \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
